<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
</head>
<body>

    <h1>Cadastro de Alunos</h1>
    
    <!-- Formulário de Cadastro -->
    <form id="formCadastro">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" required><br><br>

        <label for="idade">Idade:</label><br>
        <input type="number" id="idade" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="matricula">Matrícula:</label><br>
        <input type="text" id="matricula" required><br><br>

        <label for="curso">Nome do Curso:</label><br>
        <input type="text" id="curso" required><br><br>

        <button type="submit">Cadastre-se</button>
    </form>

    <!-- Local onde os dados serão exibidos -->
    <div id="resultado" style="margin-top: 20px;"></div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(event) {
            // Impede o formulário de recarregar a página
            event.preventDefault();

            // Captura os valores dos campos
            const nome = document.getElementById('nome').value;
            const idades = parseInt(document.getElementById('idade').value);
            const email = document.getElementById('email').value;
            const matricula = document.getElementById('matricula').value;
            const curso = document.getElementById('curso').value;

            // Verifica se é maior ou menor de idade
            let statusIdade = "";
            if (idades >= 18) {
                statusIdade = "Maior de idade";
            } else {
                statusIdade = "Menor de idade";
            }

            // Cria o texto com os dados cadastrados
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = `
                <h2>Dados Cadastrados:</h2>
                <p><strong>Nome:</strong> ${nome}</p>
                <p><strong>Idade:</strong> ${idades} anos (${statusIdade})</p>
                <p><strong>E-mail:</strong> ${email}</p>
                <p><strong>Matrícula:</strong> ${matricula}</p>
                <p><strong>Curso:</strong> ${curso}</p>
            `;
        });
    </script>

</body>
</html>
